workflows:
  somcep-ios-testflight:
    name: SOMCEP 2026 - iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: agpc_app_store

    environment:
      groups:
        - code-signing
      vars:
        APP_FLAVOR: somcep
        APP_NAME: "SOMCEP Events"
        API_URL: https://events.itechevent.com/api/public/api/public/mobile
        BUNDLE_ID: com.itechevent.somcep2026
      flutter: 3.41.6
      xcode: latest
      cocoapods: default

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze project
        script: flutter analyze

      - name: Run tests
        script: flutter test

      - name: Prepare iOS identity and app icon
        script: |
          python3 -m pip install 'Pillow==11.3.0'
          python3 scripts/prepare_ios.py --flavor "$APP_FLAVOR" --bundle-id "$BUNDLE_ID" --app-name "$APP_NAME"

      - name: Initialize iOS keychain
        script: keychain initialize

      - name: Fetch or create iOS signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Install iOS signing certificate
        script: keychain add-certificates

      - name: Configure iOS code signing
        script: xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build signed SOMCEP IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=APP_FLAVOR=$APP_FLAVOR \
            --dart-define=API_URL=$API_URL \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration

